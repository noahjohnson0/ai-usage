name: render

# Re-merge all machine slices + fetch OpenRouter cloud-side, then regenerate the
# public usage.json and the animated SVG card. Runs when any machine pushes a new
# slice (data/**) and on a schedule so the card stays fresh and OpenRouter spend
# updates even if no machine reported.
on:
  push:
    paths:
      - "data/machines/**"
      - "scripts/**"
      - "reporter/adapters/openrouter.mjs"
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Merge slices (+ cloud OpenRouter)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROVISIONING_KEY: ${{ secrets.OPENROUTER_PROVISIONING_KEY }}
        run: node scripts/merge.mjs
      - name: Render SVG card
        run: node scripts/render-svg.mjs
      - name: Commit refreshed outputs
        run: |
          git config user.name "ai-usage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/usage.json public/card.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "render: refresh usage card"
            git push
          fi
